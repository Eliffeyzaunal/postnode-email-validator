name: Testler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: postnode_validator
          MYSQL_USER: postnode
          MYSQL_PASSWORD: postnode_test_password
          MYSQL_ROOT_PASSWORD: postnode_root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -upostnode -ppostnode_test_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://postnode:postnode_test_password@127.0.0.1:3306/postnode_validator?charset=utf8mb4
      TEST_MYSQL_DATABASE_URL: mysql+pymysql://postnode:postnode_test_password@127.0.0.1:3306/postnode_validator?charset=utf8mb4
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt

      - name: Otomatik testleri çalıştır
        run: pytest --junitxml=outputs/evidence/tests.xml

      - name: Görev 1 kapsam kanıtını üret
        run: >-
          pytest
          tests/test_api.py
          tests/test_dns_cache.py
          tests/test_dns_checker.py
          tests/test_evaluation_evidence.py
          tests/test_parser.py
          tests/test_privacy.py
          tests/test_repository.py
          tests/test_syntax.py
          tests/test_task1_address_rules.py
          tests/test_task1_holdout_evaluation.py
          tests/test_task1_live_challenge.py
          tests/test_task1_live_dns_benchmark.py
          tests/test_validator.py
          --cov=app.address_rules
          --cov=app.dns_checker
          --cov=app.parser
          --cov=app.privacy
          --cov=app.repository
          --cov=app.syntax
          --cov=app.validator
          --cov-report=term-missing
          --cov-report=xml:outputs/evidence/task1-coverage.xml
          --cov-report=json:outputs/evidence/task1-coverage.json
          --cov-fail-under=95


      - name: Görev 2 blocklist kapsam kanıtını üret
        run: >-
          pytest
          tests/test_blocklist_checker.py
          tests/test_blocklist_dns_live.py
          tests/test_blocklist_scheduler.py
          tests/test_blocklist_service.py
          tests/test_blocklist_cli.py
          tests/test_mysql_integration.py
          --cov=app.blocklist
          --cov-report=term-missing
          --cov-report=xml:outputs/evidence/task2-coverage.xml
          --cov-report=json:outputs/evidence/task2-coverage.json
          --cov-fail-under=90

      - name: Değerlendirme kümesini çalıştır
        run: python scripts/evaluate.py --output outputs/evidence/evaluation.json --markdown outputs/evidence/evaluation.md

      - name: Görev 1 dondurulmuş holdout setini çalıştır
        run: >-
          python scripts/evaluate_task1_holdout.py
          --output outputs/evidence/task1-holdout.json
          --markdown outputs/evidence/task1-holdout.md
          --min-accuracy 0.90

      - name: Görev 1 bağımsız syntax referansını çalıştır
        run: >-
          python scripts/evaluate_task1_syntax_reference.py
          --output outputs/evidence/task1-syntax-reference.json
          --markdown outputs/evidence/task1-syntax-reference.md
          --min-agreement 0.85

      # The 200-address live challenge is intentionally not run in CI: DNS
      # availability and resolver policy would make the metric non-deterministic.


      - name: Görev 4 bounce sınıflandırıcı kapsam kanıtını üret
        run: >-
          pytest
          tests/test_bounce_api.py
          tests/test_bounce_classifier.py
          tests/test_bounce_cli.py
          tests/test_bounce_evaluation.py
          tests/test_bounce_io.py
          tests/test_bounce_privacy.py
          tests/test_bounce_rule_validation.py
          --cov=app.bounce_classifier
          --cov-report=term-missing
          --cov-report=xml:outputs/evidence/task4-coverage.xml
          --cov-report=json:outputs/evidence/task4-coverage.json
          --cov-fail-under=90

      - name: Bounce sınıflandırıcı değerlendirmesini çalıştır
        run: >-
          python scripts/evaluate_bounce_classifier.py
          --output outputs/evidence/bounce-evaluation.json
          --markdown outputs/evidence/bounce-evaluation.md
          --unknown-output outputs/evidence/bounce-unknown-patterns.json
          --unknown-markdown outputs/evidence/bounce-unknown-patterns.md

      - name: 10.000 adres benchmark'ını çalıştır
        run: python scripts/benchmark.py --require-mysql --output outputs/evidence/mysql-benchmark.json --markdown outputs/evidence/mysql-benchmark.md

      - name: Ölçüm dosyalarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-evidence-python-${{ matrix.python-version }}
          path: outputs/evidence/
          retention-days: 30
          if-no-files-found: warn
