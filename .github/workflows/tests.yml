name: Testler

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: postnode_validator
          MYSQL_USER: postnode
          MYSQL_PASSWORD: postnode_test_password
          MYSQL_ROOT_PASSWORD: postnode_root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -upostnode -ppostnode_test_password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql+pymysql://postnode:postnode_test_password@127.0.0.1:3306/postnode_validator?charset=utf8mb4
      TEST_MYSQL_DATABASE_URL: mysql+pymysql://postnode:postnode_test_password@127.0.0.1:3306/postnode_validator?charset=utf8mb4
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Kodu indir
        uses: actions/checkout@v5

      - name: Python kur
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Bağımlılıkları kur
        run: pip install -r requirements-dev.txt

      - name: Otomatik testleri çalıştır
        run: pytest --junitxml=outputs/evidence/tests.xml

      - name: Değerlendirme kümesini çalıştır
        run: python scripts/evaluate.py --output outputs/evidence/evaluation.json --markdown outputs/evidence/evaluation.md

      - name: Bounce sınıflandırıcı değerlendirmesini çalıştır
        run: >-
          python scripts/evaluate_bounce_classifier.py
          --output outputs/evidence/bounce-evaluation.json
          --markdown outputs/evidence/bounce-evaluation.md
          --unknown-output outputs/evidence/bounce-unknown-patterns.json
          --unknown-markdown outputs/evidence/bounce-unknown-patterns.md

      - name: 10.000 adres benchmark'ını çalıştır
        run: python scripts/benchmark.py --require-mysql --output outputs/evidence/mysql-benchmark.json --markdown outputs/evidence/mysql-benchmark.md

      - name: Ölçüm dosyalarını sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-evidence-python-${{ matrix.python-version }}
          path: outputs/evidence/
          retention-days: 30
          if-no-files-found: warn
